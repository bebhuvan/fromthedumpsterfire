<!doctype html>
<!-- Source of public/og.png, the default share image (1200x630), used when a page has no Haul card or
     plate. Rendered with (from apps/web):
     google-chrome --headless=new --hide-scrollbars --allow-file-access-from-files --window-size=1200,630 --screenshot=public/og.png scripts/og.html
     Type, the masthead's marks and the type swatches only; no generated imagery. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: 'ND'; src: url('../public/fonts/NewsreaderDisplay-Medium.woff2'); font-weight: 500; }
@font-face { font-family: 'ND'; src: url('../public/fonts/NewsreaderDisplay-Regular.woff2'); font-weight: 400; }
@font-face { font-family: 'ND'; src: url('../public/fonts/NewsreaderDisplay-Italic.woff2'); font-weight: 400; font-style: italic; }
@font-face { font-family: 'SG'; src: url('../public/fonts/Schibsted-Medium.woff2'); font-weight: 500; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #FFFFFF; color: #141416; font-family: 'ND', serif; padding: 0 72px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; position: relative; }
.mast { font-weight: 500; font-size: 112px; line-height: 0.98; letter-spacing: -0.03em; }
.mast i { font-weight: 400; letter-spacing: -0.01em; }
.mast s { text-decoration: none; position: relative; color: #55555C; font-weight: 400; }
.mast s::after { content: ''; position: absolute; left: -0.06em; right: -0.08em; top: 0.33em; height: 0.3em; background: #FF4F1F; -webkit-mask: url('../public/marks/strike.svg') center / 100% 100% no-repeat; }
.caret { display: inline-block; width: 0.3em; height: 0.24em; margin: 0 -0.1em 0 -0.02em; vertical-align: -0.12em; background: #FF4F1F; -webkit-mask: url('../public/marks/caret.svg') center / contain no-repeat; }
.strap { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 14px; border-top: 2px solid #141416; font-family: 'SG', sans-serif; font-weight: 500; font-size: 22px; color: #55555C; }
.keys { position: absolute; left: 72px; right: 72px; bottom: 56px; display: flex; gap: 10px; }
.keys span { flex: 1; height: 10px; }
</style>
</head>
<body>
<div class="mast"><i>From the</i> <s>Internet</s><span class="caret"></span><br>Dumpster Fire</div>
<div class="strap"><span>Irregular hauls of things worth salvaging from the internet and the archive</span><span>fromthedumpsterfire.com</span></div>
<div class="keys"><span style="background:#FFE0C2"></span><span style="background:#FFD8D0"></span><span style="background:#FFF0A6"></span><span style="background:#DCEBFF"></span><span style="background:#D2F3E2"></span><span style="background:#E6F2C8"></span><span style="background:#ECE4FA"></span><span style="background:#D3EFF0"></span></div>
</body>
</html>
