/* From the Dumpster Fire, web edition. Design: Salvage (docs/DESIGN.md).
   Colours come only from /tokens.css (generated from packages/shared/src/tokens.ts); .t-<type> and
   .s-<swatch> set --tint. Type roles encode authorship: the serif is the editor and the source; the
   blue sans (.machine) is always and only the machine. Ember is the brand's: the flame, the strike
   through "Internet", the editor's "B." and the folio. One loud thing per screen. */

@font-face { font-family: 'Newsreader Text'; src: url('../../../apps/web/public/fonts/NewsreaderText-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Newsreader Text'; src: url('../../../apps/web/public/fonts/NewsreaderText-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Newsreader Display'; src: url('../../../apps/web/public/fonts/NewsreaderDisplay-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Newsreader Display'; src: url('../../../apps/web/public/fonts/NewsreaderDisplay-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Newsreader Display'; src: url('../../../apps/web/public/fonts/NewsreaderDisplay-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'DM Mono'; src: url('../../../apps/web/public/fonts/DMMono-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'DM Mono'; src: url('../../../apps/web/public/fonts/DMMono-Italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Schibsted Grotesk'; src: url('../../../apps/web/public/fonts/Schibsted-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Schibsted Grotesk'; src: url('../../../apps/web/public/fonts/Schibsted-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Schibsted Grotesk'; src: url('../../../apps/web/public/fonts/Schibsted-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

/* Layout: a wide left margin for the apparatus, an off-centre reading column, air on the right. */
:root {
  --serif: 'Newsreader Text', Georgia, 'Times New Roman', serif;
  --display: 'Newsreader Display', 'Newsreader Text', Georgia, serif;
  --sans: 'Schibsted Grotesk', ui-sans-serif, system-ui, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --gut: 16px;
  --colgap: 0px;
  --margin: 17rem;
  --tint: var(--butter);
  --hair: color-mix(in srgb, var(--ink) 14%, transparent);
}
@media (min-width: 640px) { :root { --gut: 28px; } }
@media (min-width: 1000px) { :root { --gut: 48px; --colgap: clamp(40px, 5vw, 72px); } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; position: relative; overflow-x: hidden;
  background: var(--bg); color: var(--ink);
  font: 18px/1.55 var(--serif);
  font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; overflow-wrap: break-word;
}
h1, h2, h3, p, ol, ul, figure, blockquote { margin: 0; }
ol, ul { list-style: none; padding: 0; }
img { max-width: 100%; height: auto; display: block; }
button { font: inherit; color: inherit; }
em, i { font-style: italic; }
b { font-weight: 400; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; text-decoration-color: color-mix(in srgb, currentColor 45%, transparent); }
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
main:focus { outline: none; }
::selection { background: var(--butter); color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -60px; z-index: 10; background: var(--ink); color: var(--bg); padding: 8px 12px; font: 500 14px var(--sans); text-decoration: none; }
.skip:focus { top: 8px; }
.ink2 { color: var(--ink2); }
.small { font-size: 15px; line-height: 1.5; }
.display { font-family: var(--display); }
.title em, .display em { font-weight: 400; }


/* The machine: blue sans, small and exact, with its source. */
.machine { font-family: var(--sans); color: var(--machine); font-size: 15px; line-height: 1.5; }
.machine cite { font-style: normal; color: var(--ink2); }
.machine cite::before { content: '· '; }

/* ---------- Charts: the figure (Chart.astro). The chart is SVG drawn on the server from the bundle's
   rows; shape colours are classes from tokens.css (chartCss). A wide figure and a phone figure are
   both in the page, and the column's own width chooses which shows. ---------- */
.blk-chart { row-gap: 0; }
@media (min-width: 1000px) { .blk-chart .ch-plot { grid-column: 2 / -1; max-width: 720px; } }
.ch-head { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--ink); }
.ch-n { font: 500 12px/1.3 var(--sans); color: var(--ink2); letter-spacing: 0.01em; margin-bottom: 4px; }
.ch-n span { color: var(--ember); }
.ch-t { font: 500 clamp(24px, 2.6vw, 31px)/1.1 var(--display); letter-spacing: -0.014em; text-wrap: balance; max-width: 32rem; }
.ch-note { font: italic 400 17px/1.42 var(--serif); max-width: 34rem; text-wrap: pretty; margin-top: 2px; }
.ch-units { margin-top: 10px; font: 400 13px/1.45 var(--sans); color: var(--ink2); max-width: 40rem; }
.ch-plot { container-type: inline-size; margin-top: 14px; }
.ch-svg { display: block; width: 100%; height: auto; overflow: visible; }
.ch-svg text { font-kerning: normal; }
.ch-wide { max-width: 720px; }
.ch-narrow { display: none; max-width: 440px; }
@container (max-width: 559px) { .ch-wide { display: none; } .ch-narrow { display: block; } }
.ch-undrawn { font: italic 400 16px/1.45 var(--serif); color: var(--ink2); padding: 24px 0; }
.ch-foot { display: grid; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
.ch-gloss { font-size: 13px; line-height: 1.45; max-width: 40rem; }
.ch-src { font: 400 12.5px/1.45 var(--sans); color: var(--ink2); max-width: 44rem; text-wrap: pretty; }
.ch-src a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 2px; }
.ch-src a:hover { color: var(--ink); text-decoration-color: currentColor; }
.ch-share { font: 400 13px/1.4 var(--sans); }
.ch-share a { color: var(--ink); text-decoration-color: var(--rule); text-underline-offset: 3px; }
.ch-share a:hover { text-decoration-color: currentColor; }
.ch-data summary { display: inline-flex; gap: 10px; align-items: baseline; font: 500 13px/1.4 var(--sans); cursor: pointer; list-style: none; }
.ch-data summary::-webkit-details-marker { display: none; }
.ch-data summary::before { content: '+'; display: inline-block; width: 0.8em; color: var(--ink2); }
.ch-data[open] summary::before { content: '–'; }
.ch-data summary span { font-weight: 400; color: var(--ink2); }
.ch-tbl { max-height: 26rem; overflow: auto; margin-top: 10px; border-top: 1px solid var(--ink); }
.ch-tbl table { border-collapse: collapse; width: 100%; font: 400 13px/1.4 var(--sans); font-variant-numeric: tabular-nums; }
.ch-tbl th { position: sticky; top: 0; background: var(--bg); text-align: left; font-weight: 500; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: bottom; }
.ch-tbl th span { font-weight: 400; color: var(--ink2); }
.ch-tbl td { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.ch-tbl .num { text-align: right; }
.ch-tbl .na { color: var(--ink2); }
/* The figure as a specimen on the cover: its own chart, drawn small. */
.sp-figure .sp-obj { border: 1px solid var(--rule); padding: 16px 18px 14px; gap: 12px; }
.sp-fig-t { font: 500 clamp(24px, 2.6vw, 32px)/1.05 var(--display); letter-spacing: -0.015em; text-wrap: balance; }
.sp-fig-t em { font-weight: 400; }
.sp-fig-svg { display: block; width: 100%; height: auto; }
.sp-fig-src { font: 400 12px/1.4 var(--sans); color: var(--ink2); }
@media (min-width: 700px) { .sp-figure { grid-column: span 7; } }


.comps { max-width: 760px; margin: 0 0 0 max(var(--gut), calc(50vw - 600px)); padding: 48px var(--gut) 96px 0; display: grid; gap: 88px; }
.comps-head { display: grid; gap: 12px; padding-bottom: 8px; }
.comps-head p:first-child { font: 500 13px/1.4 var(--sans); color: var(--ink2); }
.comps-head h1 { font: 500 clamp(40px, 6vw, 64px)/1 var(--display); letter-spacing: -0.03em; }
.comps-head p.deck { font: italic 400 19px/1.45 var(--serif); max-width: 34rem; }
.comps-nav { display: flex; flex-wrap: wrap; gap: 4px 18px; font: 400 14px/1.4 var(--sans); }
.comps-nav a[aria-current] { text-decoration: underline; text-decoration-color: var(--ember); text-decoration-thickness: 2px; }
.ch-n i { font-style: normal; color: var(--ink2); margin-left: 8px; }
@media (max-width: 640px) { .comps { margin-left: var(--gut); padding-right: var(--gut); gap: 64px; } }
