<!doctype html>
<!-- The Play Store feature graphic, 1024 x 500. The masthead as the site sets it: "Internet" struck
     in ember with a proofreader's caret, then the strap. Shoot with headless Chromium at 1024x500. -->
<html lang="en">
<meta charset="utf-8">
<title>Feature graphic</title>
<style>
@font-face { font-family: 'ND'; src: url('../../../apps/web/public/fonts/NewsreaderDisplay-Regular.woff2'); font-weight: 400; }
@font-face { font-family: 'ND'; src: url('../../../apps/web/public/fonts/NewsreaderDisplay-Medium.woff2'); font-weight: 500; }
@font-face { font-family: 'ND'; src: url('../../../apps/web/public/fonts/NewsreaderDisplay-Italic.woff2'); font-style: italic; }
@font-face { font-family: 'NT'; src: url('../../../apps/web/public/fonts/NewsreaderText-Italic.woff2'); font-style: italic; }
@font-face { font-family: 'SG'; src: url('../../../apps/web/public/fonts/Schibsted-Medium.woff2'); font-weight: 500; }
:root { --bg: #FFFFFF; --ink: #141416; --ink2: #55555C; --rule: #E6E6EA; --ember: #FF4F1F; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1024px; height: 500px; overflow: hidden; background: var(--bg); color: var(--ink); }
body { position: relative; padding: 64px 72px; }
.top { display: flex; align-items: center; gap: 12px; font: 500 15px/1 'SG'; color: var(--ink2); letter-spacing: 0.01em; }
.flame { width: 13px; height: 24px; background: var(--ember); -webkit-mask: url('../../../apps/web/public/marks/flame.svg') center / contain no-repeat; }
.mast { margin-top: 42px; font: 500 112px/0.92 'ND'; letter-spacing: -0.035em; }
.mast .a { display: block; font: italic 400 40px/1 'ND'; letter-spacing: 0; margin-bottom: 10px; }
.mast s { text-decoration: none; position: relative; color: var(--ink2); font-weight: 400; }
.mast s::after { content: ''; position: absolute; left: -0.06em; right: -0.08em; top: 0.33em; height: 0.3em; background: var(--ember); -webkit-mask: url('../../../apps/web/public/marks/strike.svg') center / 100% 100% no-repeat; }
.caret { display: inline-block; width: 0.3em; height: 0.24em; margin: 0 -0.1em 0 -0.02em; vertical-align: -0.12em; background: var(--ember); -webkit-mask: url('../../../apps/web/public/marks/caret.svg') center / contain no-repeat; }
.strap { position: absolute; left: 72px; right: 72px; bottom: 56px; padding-top: 14px; border-top: 1px solid var(--ink); font: italic 400 24px/1.3 'NT'; color: var(--ink2); }
</style>
<body>
  <p class="top"><span class="flame"></span>Hauls, when there is enough worth sending</p>
  <h1 class="mast"><span class="a">From the</span><s>Internet</s><span class="caret"></span> Dumpster Fire</h1>
  <p class="strap">Things worth salvaging from the internet and the archive, chosen by one editor.</p>
</body>
</html>
